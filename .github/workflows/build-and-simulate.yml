name: Build Pico Firmware & Run Simulator

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    # 核心：直接使用预装好 Zephyr 环境的 Docker 容器
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.26.5
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仅保留 ccache 缓存
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 初始化并下载源码（Docker 里有极速镜像，几乎秒下）
      - name: West Init & Update
        run: |
          west init -l .
          west update

      # 编译 Pico
      - name: Build for Raspberry Pi Pico
        run: |
          west build -b rpi_pico . --build-dir build-pico -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Upload Pico firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico-firmware
          path: build-pico/zephyr/zephyr.uf2

      # 编译 native_sim
      - name: Build for native_sim
        run: |
          west build -b native_sim . --build-dir build-sim -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run on native_sim and capture output
        timeout-minutes: 2
        run: |
          {
            echo '```'
            echo '$ timeout 3s ./build-sim/zephyr/zephyr.exe'
            timeout 3s ./build-sim/zephyr/zephyr.exe 2>&1 || true
            echo '```'
          } > sim-output.log
          cat sim-output.log

      # 更新 README
      - name: Update README with sim output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re
          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          output = Path("sim-output.log").read_text(encoding="utf-8").strip()
          start, end = "<!-- SIM_OUTPUT_START -->", "<!-- SIM_OUTPUT_END -->"
          if start not in readme or end not in readme:
              raise SystemExit(f"README.md 缺少占位标记")
          new_readme = re.sub(rf"{re.escape(start)}.*?{re.escape(end)}", f"{start}\n{output}\n{end}", readme, flags=re.DOTALL)
          if new_readme != readme:
              readme_path.write_text(new_readme, encoding="utf-8")
          EOF
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update native_sim output [skip ci]"
          git push origin HEAD:main