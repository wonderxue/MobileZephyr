name: Build Pico Firmware & Run Simulator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 允许 workflow 用默认 GITHUB_TOKEN 推送 README 更新
permissions:
  contents: write

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 缓存 1：ccache 编译对象 ----------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('west.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ hashFiles('west.yml') }}-
            ${{ runner.os }}-ccache-

      # ---------- 缓存 2：West workspace 源码 ----------
      # 注意：不缓存 .west 目录，避免与 action 内部的 west init 冲突
      - name: Cache West workspace
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../zephyr
            ${{ github.workspace }}/../modules
            ${{ github.workspace }}/../tools
            ${{ github.workspace }}/../bootloader
          key: ${{ runner.os }}-west-${{ hashFiles('west.yml') }}
          restore-keys: |
            ${{ runner.os }}-west-

      # ---------- 安装并配置 Zephyr（内置开启 ccache）----------
      - name: Setup Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: .
          toolchains: arm-zephyr-eabi
          enable-ccache: true

      # ---------- 1. 为真实 Pico 硬件构建 ----------
      - name: Build for Raspberry Pi Pico
        run: |
          west build -b rpi_pico . --build-dir build-pico

      - name: Upload Pico firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico-firmware
          path: build-pico/zephyr/zephyr.uf2

      # ---------- 2. 为 native_sim 构建并运行 ----------
      - name: Build for native_sim
        run: |
          west build -b native_sim . --build-dir build-sim

      - name: Run on native_sim and capture output
        timeout-minutes: 2
        run: |
          {
            echo '```'
            echo '$ timeout 3s ./build-sim/zephyr/zephyr.exe'
            timeout 3s ./build-sim/zephyr/zephyr.exe 2>&1 || true
            echo '```'
          } > sim-output.log
          echo "=== Captured output ==="
          cat sim-output.log

      # ---------- 3. 把模拟输出写回 README（仅 main 分支 push 时）----------
      - name: Update README with sim output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          output = Path("sim-output.log").read_text(encoding="utf-8").strip()

          start, end = "<!-- SIM_OUTPUT_START -->", "<!-- SIM_OUTPUT_END -->"
          if start not in readme or end not in readme:
              raise SystemExit(f"README.md 缺少占位标记：{start} / {end}")

          new_readme = re.sub(
              rf"{re.escape(start)}.*?{re.escape(end)}",
              f"{start}\n{output}\n{end}",
              readme,
              flags=re.DOTALL,
          )

          if new_readme != readme:
              readme_path.write_text(new_readme, encoding="utf-8")
              print("README.md 已更新。")
          else:
              print("README.md 内容未变化。")
          EOF

          if git diff --quiet README.md; then
            echo "README.md 无变化，跳过提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update native_sim output [skip ci]"
          git push origin HEAD:main